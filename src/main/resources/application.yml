server:
  port: 8080

spring:
  application:
    name: viral-simulation-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.clhjzfxvenbatgwcfjof}
    password: ${SPRING_DATASOURCE_PASSWORD:2YOdxL2mRWmPLXvp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2

app:
  simulation:
    heartbeat-window-ms: 120000 # 2 minutos para el límite k
    density-window-ms: 60000     # 1 minuto para el cálculo de r
    scheduler-rate-ms: 5000      # 5 segundos entre cada Board Update
    base-growth-rate: 0.04
    max-growth-rate: 0.50
    density-coefficient: 0.08
  firebase:
    service-account-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

logging:
  level:
    root: INFO
    com.campus.viral: INFO
    org.hibernate.SQL: WARN
